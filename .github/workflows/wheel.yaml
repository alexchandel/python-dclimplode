name: Wheels

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: [cp39, cp310, cp311, cp312, cp313, cp314]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_BUILD: ${{ matrix.python }}-*
          CIBW_TEST_REQUIRES: pytest psutil pytest-xdist
          CIBW_TEST_COMMAND: >-
            pytest -q {project}/test --deselect test/test_dclimplode.py::test_dclimplode
            && pytest -n 4 -q {project}/test/test_dclimplode.py::test_dclimplode
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ runner.os }}-${{ matrix.python }}-${{ runner.arch }}
          path: wheelhouse/*.whl

  legacy-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: [cp27, cp35, cp36, cp37, cp38]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: pypa/cibuildwheel@v1.12.0
        env:
          CIBW_BUILD: ${{ matrix.python }}-manylinux_x86_64
          CIBW_TEST_COMMAND: python {project}/test/legacy_smoke.py
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-Linux-${{ matrix.python }}-X64
          path: wheelhouse/*.whl
