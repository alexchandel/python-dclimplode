name: Build check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - name: Build sdist and wheel with current build dependencies
        run: uv build
      - name: Create test environment
        run: uv venv
      - name: Install pytest
        run: uv pip install pytest
      - name: Install built wheel
        run: uv pip install --no-index --find-links dist dclimplode
      - name: Test installed extension
        run: uv run --no-project --no-sync pytest -v test
